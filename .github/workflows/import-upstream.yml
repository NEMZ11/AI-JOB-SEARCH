name: One-time import upstream

on:
  push:
    paths:
      - '.github/workflows/import-upstream.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone upstream repository
        run: git clone --depth 1 --branch master https://github.com/MadsLorentzen/ai-job-search.git /tmp/upstream

      - name: Replace destination contents with upstream
        shell: bash
        run: |
          rsync -a --delete --exclude='.git' /tmp/upstream/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to import."
            exit 0
          fi
          git commit -m "Import MadsLorentzen/ai-job-search"
          git push origin HEAD:main
